[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodesperdicio"
version = "0.1.0"
description = "Assistente de IA para aproveitar alimentos de casa (Challenge 2 - Qualidade de Vida)"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.65",
  "chromadb>=1.5",
  "fastembed>=0.9",
  "anthropic>=2.8",
  "python-dotenv>=1.0",
  "numpy",
  "pandas",
  "mlflow>=3.18,<4",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    # Aviso interno do mlflow/sqlalchemy ao criar o banco; não é do nosso código.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
]
